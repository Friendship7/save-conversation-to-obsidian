name: Release

# Builds the uploadable skill ZIP and attaches it to a GitHub release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build skill ZIP
        run: |
          cd skills
          zip -r ../save-conversation-to-obsidian.zip save-conversation-to-obsidian

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: save-conversation-to-obsidian.zip
          generate_release_notes: true
